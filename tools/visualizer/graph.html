                    prefix += (j === i - 1) ? '  ' : '│ ';
                }
                // Check if this entry is forced
                const isForced = state[assignedMg].domain.size === 1;
                const label = isForced ? `MG${assignedMg + 1}=p${assignedPerm} (FORCED)` : `MG${assignedMg + 1}=p${assignedPerm}`;
                lines.push(`${prefix}├─ ${label}`);
            }
            
            // If finished, add solution marker
            if (extractionState.finished && extractionState.solutions.length > 0) {
                lines.push(`  └─ SOLUTION #${extractionState.solutions.length}`);
            }
            
            tree.textContent = lines.join('\n');
        }

        function undoLastStep() {
            if (extractionState.domainHistory.length === 0) return;
            const prev = extractionState.domainHistory.pop();
            for (let m = 0; m < 9; m++) {
                extractionState.domains.set(m, prev[m].domain);
                extractionState.assignments.set(m, prev[m].assignment);
            }
            extractionState.currentMg = null;
            extractionState.currentCandidate = null;
            extractionState.stepMode = null;
            renderDomainsGrid();
            renderCandidateStrip(null);
            clearExtractionHighlights();
            renderSearchTree();
            document.getElementById('extraction-status').textContent = 'Undid last step';
        }

        function clearExtractionHighlights() {
            d3.selectAll('.node-group').classed('faded', false).classed('highlighted', false);
            nodesGroup.selectAll('.node-circle')
                .classed('node-supported', false)
                .classed('node-unsupported', false)
                .classed('node-dying', false)
                .classed('node-cascade-warn', false)
                .attr('fill', d => colorScale(d.minigrid));
            edgesGroup.selectAll('path').classed('highlighted', false).classed('faded', false);
            document.getElementById('support-panel')?.remove();
            document.querySelectorAll('.domain-cell').forEach(c => {
                c.classList.remove('mrv-selected');
            });
            d3.selectAll('.causal-edge').remove();
            d3.selectAll('.death-label').remove();
            d3.selectAll('.node-group').each(function(d) {
                d3.select(this).style('display', pruningState.alive.get(d.id) ? null : 'none');
            }).classed('node-removing', false);
            nodesGroup.selectAll('.node-circle').classed('node-forced', false).classed('node-trial', false).classed('node-alive-candidate', false).classed('node-contradiction-cause', false);
            // Hide every edge that touches a dead node (Phase 5 pruned) or a hidden node
            edgesGroup.selectAll('path').each(function(e) {
                const srcAlive = pruningState.alive.get(e.source.id);
                const tgtAlive = pruningState.alive.get(e.target.id);
                const srcVisible = d3.selectAll('.node-group').filter(d => d.id === e.source.id).style('display') !== 'none';
                const tgtVisible = d3.selectAll('.node-group').filter(d => d.id === e.target.id).style('display') !== 'none';
                if (!srcAlive || !tgtAlive || !srcVisible || !tgtVisible) {
                    d3.select(this).style('display', 'none');
                } else {
                    d3.select(this).style('display', null);
                }
            });
        }

        function reconstructBoard() {
            const board = Array.from({length: 9}, () => Array(9).fill('.'));
            for (const [mg, perm] of extractionState.assignments) {
                if (perm === null) continue;
                const nodeId = getNodeId(mg, perm);
                const node = graphData.nodes.find(n => n.id === nodeId);
                if (!node) continue;
                const cells = node.cells;
                const br = Math.floor(mg / 3) * 3;
                const bc = (mg % 3) * 3;
                for (let i = 0; i < 9; i++) {
                    const lr = Math.floor(i / 3);
                    const lc = i % 3;
                    board[br + lr][bc + lc] = cells[i];
                }
            }
            return board;
        }

        function renderSolutionBoard(board) {
            const container = document.getElementById('solution-board-container');
            container.innerHTML = '<div style="font-size:11px;color:#9ca3af;margin-bottom:4px">Solution Board</div>';
            const table = document.createElement('table');
            table.style.cssText = 'border-collapse:collapse;margin:0 auto';
            for (let r = 0; r < 9; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < 9; c++) {
                    const td = document.createElement('td');
                    td.className = 'solution-board-cell';
                    td.textContent = board[r][c] === '.' ? '·' : board[r][c];
                    if (GIVEN_CELLS.has(`${r},${c}`)) {
                        td.classList.add('given');
                    } else if (board[r][c] !== '.') {
                        td.classList.add('solved');
                    }
                    // Thicker borders for 3x3 blocks
                    const br = Math.floor(r / 3) * 3;
                    const bc = Math.floor(c / 3) * 3;
                    td.style.borderRight = (c % 3 === 2 && c < 8) ? '2px solid #60a5fa' : '1px solid #1e2642';
                    td.style.borderBottom = (r % 3 === 2 && r < 8) ? '2px solid #60a5fa' : '1px solid #1e2642';
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            container.appendChild(table);
        }

        // ── Pruning Data Structures ────────────────────────────────────────────────

        function precomputePruningData() {
            // 1. Build node lookup: id → node
            const nodeById = {};
            graphData.nodes.forEach(n => { nodeById[n.id] = n; });

            // 2. Build compatible: "mgX_pY" → { otherMg: Set(perm_ids) }
            const compat = new Map();
            graphData.nodes.forEach(n => { compat.set(n.id, {}); });
            graphData.edges.forEach(e => {
                const src = nodeById[e.source], dst = nodeById[e.target];
                if (!src || !dst) return;
                if (!compat.get(src.id)[dst.minigrid]) compat.get(src.id)[dst.minigrid] = new Set();
                if (!compat.get(dst.id)[src.minigrid]) compat.get(dst.id)[src.minigrid] = new Set();
                compat.get(src.id)[dst.minigrid].add(dst.perm_id);
                compat.get(dst.id)[src.minigrid].add(src.perm_id);
            });

            // 3. Build relations matrix
            const relations = Array.from({length: 9}, () => Array(9).fill('Not'));
            for (let a = 0; a < 9; a++) {
                for (let b = 0; b < 9; b++) {
                    if (a === b) continue;
                    if (Math.floor(a / 3) === Math.floor(b / 3)) relations[a][b] = 'Row';
                    else if (a % 3 === b % 3) relations[a][b] = 'Col';
                }
            }

            // 4. Initialize alive and supports
            const alive = new Map();
            const supports = new Map();
            graphData.nodes.forEach(n => {
                alive.set(n.id, true);
                const nodeSupports = {};
                for (let otherMg = 0; otherMg < 9; otherMg++) {
                    if (relations[n.minigrid][otherMg] === 'Not') continue;
                    const compatPerms = compat.get(n.id)[otherMg] || new Set();
                    nodeSupports[otherMg] = compatPerms.size;
                }
                supports.set(n.id, nodeSupports);
            });

            pruningState = {
                alive, supports, compatible: compat, relations,
                deathRound: new Map(),
                rounds: [], currentRound: 0, running: false,
            };
            document.getElementById('alive-count').textContent = graphData.nodes.length;
        }

        function computePruningRounds() {
            const { alive, compatible, relations } = pruningState;
            const rounds = [];
            
            while (true) {
                const removals = [];
                for (const [nodeId, isAlive] of alive) {
                    if (!isAlive) continue;
                    const node = graphData.nodes.find(n => n.id === nodeId);
                    const mg = node.minigrid;
                    const compats = compatible.get(nodeId);
                    
                    let unsupported = false;
                    for (let otherMg = 0; otherMg < 9; otherMg++) {
                        if (relations[mg][otherMg] === 'Not') continue;
                        const compatPerms = compats[otherMg] || new Set();
                        let hasLive = false;
                        for (const cp of compatPerms) {
                            const cpId = `mg${otherMg}_p${cp}`;
                            if (alive.get(cpId)) { hasLive = true; break; }
                        }
                        if (!hasLive) { unsupported = true; break; }
                    }
                    if (unsupported) removals.push(nodeId);
                }
                if (removals.length === 0) break;
                removals.forEach(id => alive.set(id, false));
                rounds.push(removals);
            }
            
            // Reset alive (rounds are precomputed for playback)
            graphData.nodes.forEach(n => alive.set(n.id, true));
            pruningState.rounds = rounds;
            pruningState.currentRound = 0;
            
            // Build timeline bars
            renderTimeline();
            
            return rounds;
        }

        function renderTimeline() {
            const container = document.getElementById('round-timeline');
            container.innerHTML = '';
            const maxRemovals = Math.max(...pruningState.rounds.map(r => r.length), 1);
            pruningState.rounds.forEach((round, i) => {
                const bar = document.createElement('div');
                bar.className = 'round-bar';
                bar.style.flex = round.length;
                bar.title = `Round ${i+1}: ${round.length} removals`;
                bar.dataset.round = i;
                bar.addEventListener('click', () => playRound(i));
                container.appendChild(bar);
            });
        }

        function playRound(roundIdx) {
            if (roundIdx < 0 || roundIdx >= pruningState.rounds.length) return;
            const round = pruningState.rounds[roundIdx];
            
            // Update timeline
            document.querySelectorAll('.round-bar').forEach((bar, i) => {
                bar.classList.toggle('completed', i <= roundIdx);
                bar.classList.toggle('active', i === roundIdx);
            });
            
            // Phase 1: Pulse dying nodes red (batch)
            d3.selectAll('.node-group').each(function(d) {
                if (round.includes(d.id)) {
                    d3.select(this).select('.node-circle').classed('node-dying', true);
                }
            });
            
            // After 600ms: fade them + their edges + redistribute survivors
            const token = pruningRunToken;
            setTimeout(() => {
                if (token !== pruningRunToken) return;
                d3.selectAll('.node-group').each(function(d) {
                    if (round.includes(d.id)) {
                        d3.select(this).classed('node-dead', true);
                        d3.select(this).select('.node-circle').classed('node-dying', false);
                    }
                });
                
                // Fade edges touching dead nodes
                const deadSet = new Set(round);
                edgesGroup.selectAll('path').each(function(e) {
                    if (deadSet.has(e.source.id) || deadSet.has(e.target.id)) {
                        d3.select(this).classed('dead-edge', true);
                    }
                });
                
                // Mark as dead in state
                round.forEach(id => {
                    pruningState.alive.set(id, false);
                    pruningState.deathRound.set(id, roundIdx + 1);
                });
                
                // Recompute supports for surviving nodes
                updateSupports();
                
                pruningState.currentRound = roundIdx + 1;
                updatePruningInfo();
                
                // Redistribute survivors to close gaps
                relayoutSurvivors();
                
                // Show cascade causality if there's a next round
                if (roundIdx + 1 < pruningState.rounds.length) {
                    showCascadeCause(round, pruningState.rounds[roundIdx + 1]);
                }
            }, 600);
        }

        function updateSupports() {
            pruningState.supports.forEach((supps, nodeId) => {
                const node = graphData.nodes.find(n => n.id === nodeId);
                if (!pruningState.alive.get(nodeId)) return;
                for (const otherMg in supps) {
                    const compatPerms = pruningState.compatible.get(nodeId)[otherMg] || new Set();
                    let count = 0;
                    for (const cp of compatPerms) {
                        if (pruningState.alive.get(`mg${otherMg}_p${cp}`)) count++;
                    }
                    supps[otherMg] = count;
                }
            });
        }

        function updatePruningInfo() {
            const aliveCount = Array.from(pruningState.alive.values()).filter(v => v).length;
            document.getElementById('round-num').textContent = pruningState.currentRound;
            document.getElementById('alive-count').textContent = aliveCount;
        }

        function relayoutSurvivors() {
            // Kill all active D3 transitions to prevent transform races.
            // Without this, overlapping round animations leave dead nodes
            // at old positions with only opacity:0.06 — visible ghost nodes.
            nodesGroup.selectAll('g').interrupt();
            edgesGroup.selectAll('path').interrupt();

            // Redistribute surviving nodes in each minigrid to close gaps
            const minigrids = [0,1,2,3,4,5,6,7,8];
            const svgWidth = svg.node().clientWidth;
            const centerX = svgWidth / 2;
            const labelData = [];
            
            minigrids.forEach(mg => {
                const survivors = graphData.nodes.filter(n => 
                    n.minigrid === mg && pruningState.alive.get(n.id)
                );
                // Sort by original position to preserve ordering
                survivors.sort((a, b) => (a.originalX || a.x) - (b.originalX || b.x));
                const y = config.topMargin + mg * config.levelSpacing;
                const totalWidth = Math.max(0, (survivors.length - 1) * config.nodeSpacing);
                const startX = survivors.length === 0 ? centerX : centerX - totalWidth / 2;
                
                survivors.forEach((node, i) => {
                    node.x = startX + i * config.nodeSpacing;
                    node.y = y;
                });
                labelData.push({ mg, x: startX - 60, y: y + 4 });
            });
            
            // Animate survivors to new positions
            nodesGroup.selectAll('g')
                .filter(d => pruningState.alive.get(d.id))
                .transition()
                .duration(400)
                .attr('transform', d => `translate(${d.x}, ${d.y})`);
            
            // Dead nodes: display:none wins regardless of transition state
            nodesGroup.selectAll('g')
                .filter(d => !pruningState.alive.get(d.id))
                .style('display', 'none');
            
            // Update alive edge paths to match survivors' new positions
            edgesGroup.selectAll('path')
                .filter(function(e) { return !d3.select(this).classed('dead-edge'); })
                .transition()
                .duration(400)
                .attr('d', d => getEdgePath(d));
        }

        function showCascadeCause(deadRound, nextRound) {
            // For each node in nextRound, find which minigrid(s) lost support
            const deadSet = new Set(deadRound);
            
            nextRound.forEach(victimId => {
                const victim = graphData.nodes.find(n => n.id === victimId);
                if (!victim) return;
                
                const supports = pruningState.supports.get(victimId);
                const relations = pruningState.relations;
                if (!supports || !relations) return;
                
                // Find minigrids where support dropped to 0
                const unsupportedMgs = [];
                for (let otherMg = 0; otherMg < 9; otherMg++) {
                    if (relations[victim.minigrid][otherMg] === 'Not') continue;
                    if (supports[otherMg] === 0) {
                        unsupportedMgs.push(otherMg);
                    }
                }
                
                if (unsupportedMgs.length === 0) return;
                
                // Find the dead nodes this victim relied on for MG support
                const deadSupporters = [];
                unsupportedMgs.forEach(otherMg => {
                    const compatPerms = pruningState.compatible.get(victimId)[otherMg] || new Set();
                    for (const cp of compatPerms) {
                        const sid = `mg${otherMg}_p${cp}`;
                        if (deadSet.has(sid)) {
                            deadSupporters.push({ id: sid, mg: otherMg });
                        }
                    }
                });
                
                // Highlight the victim node with cascade pulse
                const victimEl = d3.selectAll('.node-group').filter(d => d.id === victimId);
                victimEl.select('.node-circle').classed('node-cascade-warn', true);
                
                // Draw support-removed lines from victim to dead supporters
                deadSupporters.forEach(supp => {
                    const supporter = graphData.nodes.find(n => n.id === supp.id);
                    if (!supporter) return;
                    const line = edgesGroup.append('path')
                        .attr('class', 'cascade-support-line')
                        .attr('d', getEdgePath({ source: victim, target: supporter }))
                        .attr('stroke', '#f97316')
                        .attr('stroke-width', 2)
                        .attr('stroke-opacity', 0.5)
                        .attr('stroke-dasharray', '6,4')
                        .attr('fill', 'none');
                    
                    // Pulse and remove
                    line.transition().duration(300).attr('stroke-opacity', 0.8)
                        .transition().duration(400).attr('stroke-opacity', 0.1)
                        .transition().duration(300).attr('stroke-opacity', 0.6)
                        .transition().duration(500).attr('stroke-opacity', 0)
                        .remove();
                });
            });
            
            // Add a floating label explaining the cascade
            if (nextRound.length > 0) {
                const container = document.getElementById('graph-container');
                const label = document.createElement('div');
                label.className = 'cascade-label';
                label.textContent = `${nextRound.length} nodes lost support from Round ${pruningState.currentRound}`;
                label.style.cssText = `
                    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
                    background: rgba(249, 115, 22, 0.9); color: #fff;
                    padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
                    z-index: 999; pointer-events: none; transition: opacity 0.4s;
                `;
                container.appendChild(label);
                const token = pruningRunToken;
                setTimeout(() => {
                    if (token !== pruningRunToken) return;
                    label.style.opacity = '0';
                    setTimeout(() => {
                        if (token !== pruningRunToken) return;
                        label.remove();
                    }, 400);
                }, 1200);
            }
        }

        function clearPruningVisualState() {
            clearHighlight();
            d3.selectAll('.cascade-label').remove();
            d3.selectAll('.cascade-support-line').remove();
            nodesGroup.selectAll('g')
                .interrupt()
                .style('display', null)
                .style('opacity', null)
                .style('pointer-events', null)
                .classed('node-dead', false)
                .classed('faded', false)
                .classed('highlighted', false);
            nodesGroup.selectAll('.node-circle')
                .interrupt()
                .classed('node-supported', false)
                .classed('node-unsupported', false)
                .classed('node-dying', false)
                .classed('node-cascade-warn', false)
                .classed('mg-flash-unsupported', false)
                .attr('fill', d => colorScale(d.minigrid));
            edgesGroup.selectAll('path')
                .interrupt()
                .style('opacity', null)
                .classed('dead-edge', false)
                .classed('highlighted', false)
                .classed('faded', false);
        }

        function resetPruning() {
            pruningRunToken++;
            graphData.nodes.forEach(n => pruningState.alive.set(n.id, true));
            pruningState.currentRound = 0;
            pruningState.rounds = [];
            pruningState.deathRound.clear();
            document.querySelectorAll('.round-bar').forEach(b => {
                b.classList.remove('completed', 'active');
            });
            document.getElementById('round-timeline').innerHTML = '';
            document.getElementById('round-num').textContent = '0';
            document.getElementById('alive-count').textContent = graphData.nodes.length;
            clearPruningVisualState();
            precomputePruningData();
            updateLayout();
        }

        async function runAllPruning() {
            resetPruning();
            computePruningRounds();
            const token = pruningRunToken;
            await sleep(400);
            for (let i = 0; i < pruningState.rounds.length; i++) {
                if (token !== pruningRunToken) return;
                playRound(i);
                await sleep(2500);
            }
        }



        // ── Event Bindings for Pruning Controls ────────────────────────────────────

        document.getElementById('run-pruning').addEventListener('click', runAllPruning);
        document.getElementById('step-round').addEventListener('click', () => {
            if (pruningState.rounds.length === 0) computePruningRounds();
            if (pruningState.currentRound < pruningState.rounds.length) {
                playRound(pruningState.currentRound);
            }
        });
        document.getElementById('reset-pruning').addEventListener('click', resetPruning);

        // ── Event Bindings for Extraction Controls ───────────────────────────────────────────────
        document.getElementById('extract-init').addEventListener('click', initDomains);
        document.getElementById('extract-reset').addEventListener('click', () => {
            pruningRunToken++;
            extractionState = {
                domains: new Map(),
                assignments: new Map(),
                domainHistory: [],
                solutions: [],
                currentMg: null,
                currentCandidate: null,
                stepMode: null,
                finished: false,
            };
            document.getElementById('domains-grid').innerHTML = '';
            document.getElementById('extraction-status').textContent = '';
            document.getElementById('search-tree').textContent = '';
            document.getElementById('solution-board-container').innerHTML = '';
            renderCandidateStrip(null);
            // Restore Phase 5 visibility: dead hidden, alive visible
            nodesGroup.selectAll('g').interrupt();
            nodesGroup.selectAll('g').each(function(d) {
                d3.select(this).style('display', pruningState.alive.get(d.id) ? null : 'none');
            });
            // Reset all visual classes
            nodesGroup.selectAll('g').classed('faded', false).classed('highlighted', false).classed('node-removing', false);
            nodesGroup.selectAll('.node-circle')
                .classed('node-forced', false).classed('node-trial', false)
                .classed('node-alive-candidate', false).classed('node-contradiction-cause', false)
                .attr('fill', d => colorScale(d.minigrid));
            // Compact alive survivors evenly within their minigrid rows
            // (avoid the wide gaps left by removed dead nodes)
            const svgWidth = svg.node().clientWidth;
            const centerX = svgWidth / 2;
            for (let mg = 0; mg < 9; mg++) {
                const survivors = graphData.nodes.filter(n =>
                    n.minigrid === mg && pruningState.alive.get(n.id)
                );
                // Sort by originalX to preserve perm-id ordering
                survivors.sort((a, b) => (a.originalX || a.x) - (b.originalX || b.x));
                const y = config.topMargin + mg * config.levelSpacing;
                const totalWidth = Math.max(0, (survivors.length - 1) * config.nodeSpacing);
                const startX = survivors.length <= 1 ? centerX : centerX - totalWidth / 2;
                survivors.forEach((node, i) => {
                    node.x = startX + i * config.nodeSpacing;
                    node.y = y;
                });
            }
            // Animate nodes to compacted positions
            nodesGroup.selectAll('g')
                .filter(d => pruningState.alive.get(d.id))
                .transition().duration(300)
                .attr('transform', d => `translate(${d.x}, ${d.y})`);
            // Restore edge visibility using DOM display state of endpoints
            edgesGroup.selectAll('path').style('display', null).classed('dead-edge', false).classed('causal-edge', false);
            edgesGroup.selectAll('path').each(function(e) {
                const srcDisplay = d3.selectAll('.node-group').filter(d => d.id === e.source.id).style('display');
                const tgtDisplay = d3.selectAll('.node-group').filter(d => d.id === e.target.id).style('display');
                if (srcDisplay === 'none' || tgtDisplay === 'none') {
                    d3.select(this).style('display', 'none');
                }
            });
            edgesGroup.selectAll('path')
                .transition().duration(300)
                .attr('d', d => getEdgePath(d));
        });
        // Phase 6 Step — one complete decision cycle (MRV → candidate → propagate → forced cascade)
        document.getElementById('extract-step').addEventListener('click', async () => {
            const status = document.getElementById('extraction-status');
            if (extractionState.domains.size === 0) {
                status.textContent = 'Initialize domains first';
                return;
            }
            if (extractionState.finished) {
                status.textContent = 'Search complete – Reset to try again';
                return;
            }
            
            const result = await advanceSolver({ visualize: true });
            
            if (result === 'contradiction') {
                renderDomainsGrid();
                renderSearchTree();
            } else if (result === 'solution') {
                // advanceSolver already rendered the solution
            }
        });
        // Phase 6 Auto Solve — full search with no visual delays
        document.getElementById('extract-auto').addEventListener('click', async () => {
            const status = document.getElementById('extraction-status');
            if (extractionState.domains.size === 0) {
                status.textContent = 'Initialize domains first';
                return;
            }
            
            extractionState.solutions = [];
            const token = ++pruningRunToken;
            let steps = 0;
            const MAX_STEPS = 50000;
            
            while (steps++ < MAX_STEPS && token === pruningRunToken) {
                const result = await advanceSolver({ visualize: false });
                if (result === 'done') break;
                if (result === 'solution') break;
                if (result === 'contradiction') {
                    if (extractionState.domainHistory.length === 0) break;
                    continue;
                }
            }
            
            if (extractionState.solutions.length > 0) {
                const board = reconstructBoard();
                renderSolutionBoard(board);
                status.textContent = `✓ Found ${extractionState.solutions.length} solution(s)`;
                status.style.color = '#10b981';
                d3.selectAll('.node-group').each(function(d) {
                    if (extractionState.assignments.get(d.minigrid) === d.perm_id) {
                        d3.select(this).classed('highlighted', true).classed('faded', false);
                        d3.select(this).select('.node-circle').attr('fill', '#fbbf24');
                    } else {
                        d3.select(this).classed('highlighted', false).classed('faded', true);
                    }
                });
                renderDomainsGrid();
                renderSearchTree();
            } else {
                status.textContent = 'No solution found';
                status.style.color = '#ef4444';
            }
        });
        document.getElementById('extract-undo').addEventListener('click', undoLastStep);

        document.getElementById('survivor-mode').addEventListener('change', (e) => {
            if (pruningState.rounds.length === 0) return;
            if (e.target.checked) {
                d3.selectAll('.node-group').each(function(d) {
                    if (!pruningState.alive.get(d.id)) {
                        d3.select(this).style('opacity', '0.03');
                        d3.select(this).style('pointer-events', 'none');
                    }
                });
            } else {
                d3.selectAll('.node-group').each(function(d) {
                    if (!pruningState.alive.get(d.id)) {
                        d3.select(this).style('opacity', null);
                        d3.select(this).style('pointer-events', null);
                    }
                });
            }
        });

        document.getElementById('heatmap-mode').addEventListener('change', (e) => {
            if (pruningState.rounds.length === 0) return;
            if (e.target.checked) {
                d3.selectAll('.node-group').each(function(d) {
                    const round = pruningState.deathRound.get(d.id);
                    if (round && !pruningState.alive.get(d.id)) {
                        const color = ['#ef4444','#f97316','#eab308'][round-1] || '#ef4444';
                        d3.select(this).select('.node-circle').attr('fill', color);
                    }
                });
            } else {
                d3.selectAll('.node-group').each(function(d) {
                    d3.select(this).select('.node-circle').attr('fill', colorScale(d.minigrid));
                });
            }
        });

        document.getElementById('focus-mg').addEventListener('change', (e) => {
            const focusMg = parseInt(e.target.value);
            const relations = pruningState.relations;
            
            d3.selectAll('.node-group').each(function(d) {
                if (focusMg === -1) {
                    d3.select(this).style('opacity', null).style('pointer-events', null);
                    return;
                }
                if (d.minigrid === focusMg) {
                    d3.select(this).style('opacity', '1').style('pointer-events', null);
                } else if (relations && relations[focusMg] && relations[focusMg][d.minigrid] !== 'Not') {
                    d3.select(this).style('opacity', '0.6').style('pointer-events', null);
                } else {
                    d3.select(this).style('opacity', '0.05').style('pointer-events', 'none');
                }
            });
            
            // Also dim edges
            if (focusMg === -1) {
                edgesGroup.selectAll('path').style('opacity', null);
            } else {
                edgesGroup.selectAll('path').style('opacity', function(e) {
                    if (e.source.minigrid === focusMg || e.target.minigrid === focusMg) return '0.3';
                    if (relations && relations[focusMg] && 
                        (relations[focusMg][e.source.minigrid] !== 'Not' || relations[focusMg][e.target.minigrid] !== 'Not')) return '0.08';
                    return '0.01';
                });
            }
        });

        // Auto-load graph.json on page load
        window.addEventListener('DOMContentLoaded', () => {
            fetch('../../results/graph.json')
                .then(res => res.json())
                .then(data => {
                    graphData = data;
                    visualizeGraph(data);
                    precomputePruningData();
                })
                .catch(err => console.warn('Auto-load failed, use file picker:', err));
        });

        // Clear highlight on background click
        svg.on('click', clearHighlight);
    </script>
</body>
